<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PX4 문서 챗봇</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#dfe3e8; --text:#1f2933; --sub:#6b7785; --accent:#2457c5; --warn:#b45309; --warnbg:#fff7ed; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; line-height:1.65; }
  .wrap { max-width:820px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--sub); font-size:14px; margin:0 0 20px; }
  .box { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  textarea { width:100%; min-height:72px; border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; resize:vertical; }
  textarea:focus { outline:2px solid var(--accent); border-color:transparent; }
  .row { display:flex; gap:10px; align-items:center; margin-top:10px; flex-wrap:wrap; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:9px 18px; font:inherit; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  button.ghost { background:#eef2f9; color:var(--accent); padding:6px 12px; font-size:13px; }
  .hint { color:var(--sub); font-size:13px; }
  .examples { margin-top:10px; display:flex; gap:6px; flex-wrap:wrap; }
  #result { margin-top:20px; }
  .answer { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .answer h3, .answer h4, .answer h5 { margin:14px 0 6px; }
  .answer h3:first-child { margin-top:0; }
  .answer p { margin:6px 0; }
  .answer ul, .answer ol { margin:6px 0; padding-left:22px; }
  .answer code { background:#f0f2f5; border-radius:4px; padding:1px 5px; font-size:.92em; }
  .answer pre { background:#f0f2f5; border-radius:8px; padding:10px; overflow:auto; }
  .cite { color:var(--accent); font-size:.8em; vertical-align:super; font-weight:600; }
  .refused { background:var(--warnbg); border:1px solid #fed7aa; color:var(--warn); border-radius:10px; padding:14px 16px; }
  .sources { margin-top:14px; }
  .sources h2 { font-size:15px; margin:0 0 8px; }
  .src { display:block; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; text-decoration:none; color:inherit; }
  .src:hover { border-color:var(--accent); }
  .src b { color:var(--accent); margin-right:6px; }
  .src span { color:var(--sub); font-size:13px; word-break:break-all; }
  .meta { color:var(--sub); font-size:12px; margin-top:10px; }
  .err { background:#fef2f2; border:1px solid #fecaca; color:#b91c1c; border-radius:10px; padding:14px 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PX4 문서 챗봇</h1>
  <p class="sub">PX4 Autopilot v1.17 공식 문서를 근거로 한국어로 답합니다. 근거가 없으면 답하지 않습니다.</p>

  <div class="box">
    <textarea id="q" placeholder="예: 컴퍼스 보정은 어떻게 하나요?" maxlength="500"></textarea>
    <div class="row">
      <button id="ask">질문하기</button>
      <span class="hint">Ctrl+Enter로도 전송됩니다.</span>
    </div>
    <div class="examples" id="examples"></div>
  </div>

  <div id="result"></div>
</div>

<script>
var API_URL = "https://dl8mpnmkuk.execute-api.ap-northeast-2.amazonaws.com/default/chat";
var EXAMPLES = [
  "컴퍼스 보정은 어떻게 하나요?",
  "멀티콥터의 포지션 모드가 뭔가요?",
  "배터리 페일세이프는 어떻게 설정하나요?",
  "오늘 서울 날씨 알려 주세요."
];

var qEl = document.getElementById("q");
var btn = document.getElementById("ask");
var resEl = document.getElementById("result");

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
  return s;
}

function renderMd(text) {
  var lines = String(text).split("\n");
  var out = [], list = null, code = false, buf = [];
  function closeList() { if (list) { out.push("</" + list + ">"); list = null; } }
  for (var i = 0; i < lines.length; i++) {
    var ln = lines[i];
    if (/^```/.test(ln)) {
      if (code) { out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); buf = []; code = false; }
      else { closeList(); code = true; }
      continue;
    }
    if (code) { buf.push(ln); continue; }
    var m;
    if ((m = ln.match(/^(#{1,4})\s+(.*)$/))) {
      closeList();
      var lv = Math.min(m[1].length + 2, 5);
      out.push("<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">");
    } else if ((m = ln.match(/^\s*[-*]\s+(.*)$/))) {
      if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
      out.push("<li>" + inline(m[1]) + "</li>");
    } else if ((m = ln.match(/^\s*\d+\.\s+(.*)$/))) {
      if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
      out.push("<li>" + inline(m[1]) + "</li>");
    } else if (ln.trim() === "") {
      closeList();
    } else {
      closeList();
      out.push("<p>" + inline(ln) + "</p>");
    }
  }
  if (code) out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
  closeList();
  return out.join("");
}

function show(html) { resEl.innerHTML = html; }

function render(d, sec) {
  if (d.refused) {
    show('<div class="refused">' + esc(d.answer || "근거를 찾지 못했습니다.") +
         '<div class="meta">검색어: ' + esc(d.search_query || "-") + ' · 최소 거리 ' + esc(d.best_distance) + ' · ' + sec + '초</div></div>');
    return;
  }
  var html = '<div class="answer">' + renderMd(d.answer || "") + '</div>';
  var src = d.sources || [];
  if (src.length) {
    html += '<div class="sources"><h2>근거 문서</h2>';
    for (var i = 0; i < src.length; i++) {
      var s = src[i];
      var label = s.title || s.url;
      html += '<a class="src" href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer"><b>[' + esc(s.n) + ']</b>' +
              esc(label) + '<br><span>' + esc(s.url) + '</span></a>';
    }
    html += '</div>';
  }
  html += '<div class="meta">검색어: ' + esc(d.search_query || "-") + ' · 최소 거리 ' + esc(d.best_distance) + ' · ' + sec + '초</div>';
  show(html);
}

async function ask() {
  var q = qEl.value.trim();
  if (!q) { qEl.focus(); return; }
  btn.disabled = true; btn.textContent = "찾는 중...";
  show('<div class="hint">문서를 검색하고 답변을 만드는 중입니다. (5~10초)</div>');
  var t0 = Date.now();
  try {
    var r = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q })
    });
    var d = await r.json();
    if (!r.ok) throw new Error(d.message || ("HTTP " + r.status));
    render(d, ((Date.now() - t0) / 1000).toFixed(1));
  } catch (e) {
    show('<div class="err">요청에 실패했습니다: ' + esc(e.message || e) + '</div>');
  } finally {
    btn.disabled = false; btn.textContent = "질문하기";
  }
}

btn.addEventListener("click", ask);
qEl.addEventListener("keydown", function (e) { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) ask(); });

var exBox = document.getElementById("examples");
EXAMPLES.forEach(function (t) {
  var b = document.createElement("button");
  b.className = "ghost"; b.textContent = t;
  b.addEventListener("click", function () { qEl.value = t; ask(); });
  exBox.appendChild(b);
});
</script>
</body>
</html>
